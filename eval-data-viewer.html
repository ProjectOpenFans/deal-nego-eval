<script>
var DB = JSON.parse(document.getElementById('DATA').textContent);
var RUNS = DB.runs, CASES = DB.cases;
var CASE_BY_ID = {}; CASES.forEach(function(c){CASE_BY_ID[c.caseId]=c;});
var TIER_NUM = {floor:0,crude:1,sound:2,sharp:3,brilliant:4,acceptable:1,goldman:2};
var state = {mode:'runs', run:0, qcase:0, view:'traj', raw:'query', filter:''};

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function tierClass(t){var n=(typeof t==='number')?t:(TIER_NUM[t]!=null?TIER_NUM[t]:0);return 'tb'+n;}
function fmtCash(c){if(!c||c.amount==null)return '<span class="muted">现金未定</span>';return '<span class="cash">¥'+Number(c.amount).toLocaleString()+'</span> '+(c.currency||'');}
function computeV3(res){
  var m=res.metrics||{}, v=res.verdict||{};
  var gates=['M1','M2','M3','M4'].every(function(k){return m[k]&&m[k].pass;});
  var m5=m.M5||{}; var cashBreach=(!m5.pass)&&/cash_over_cap/.test(m5.reason||'');
  var m6v=(m.M6&&typeof m.M6.value==='number')?m.M6.value:0;
  return {q:(!gates||cashBreach)?0:m6v, gates:gates, cashBreach:cashBreach, raw:v.quality};
}
function matchFilter(txt){var f=state.filter.trim().toLowerCase();return !f || txt.toLowerCase().indexOf(f)>=0;}

/* ---------- mode switch ---------- */
function renderMode(){
  var runN=RUNS.length, qN=CASES.length;
  document.getElementById('modeswitch').innerHTML=
    '<div class="mbtn'+(state.mode==='runs'?' active':'')+'" data-m="runs">对局 Entries<small>'+runN+'</small></div>'
   +'<div class="mbtn'+(state.mode==='queries'?' active':'')+'" data-m="queries">题面 Queries<small>'+qN+'</small></div>';
  [].forEach.call(document.querySelectorAll('.mbtn'),function(el){el.onclick=function(){state.mode=el.getAttribute('data-m');state.filter='';document.getElementById('filter').value='';render();document.getElementById('main').scrollTop=0;};});
}

/* ---------- sidebar list ---------- */
function renderList(){
  var h='';
  if(state.mode==='runs'){
    // group by case, in the order cases first appear in RUNS
    var order=[], seen={};
    RUNS.forEach(function(r){if(!seen[r.caseId]){seen[r.caseId]=1;order.push(r.caseId);}});
    order.forEach(function(cid){
      var c=CASE_BY_ID[cid]||{caseId:cid,title:cid,subtitle:''};
      var group=RUNS.map(function(r,i){return {r:r,i:i};}).filter(function(x){return x.r.caseId===cid;});
      var vis=group.filter(function(x){return matchFilter(cid+' '+(c.title||'')+' '+(c.subtitle||'')+' '+x.r.arm+' '+x.r.agent);});
      if(!vis.length)return;
      h+='<div class="lgrp"><b>'+esc(cid)+'</b> <span class="gt">'+esc(c.title||'')+'</span></div>';
      vis.forEach(function(x){
        var r=x.r, res=r.result, v=res.verdict||{}, m6=(res.metrics||{}).M6||{}, v3=computeV3(res);
        h+='<div class="item'+(x.i===state.run?' active':'')+(r.featured?' fav':'')+'" data-i="'+x.i+'">'
          +'<div class="top"><span class="cid">'+esc(r.run||r.arm)+'</span>'
          +'<span class="arm arm-'+(r.arm==='on'?'on':'clean')+'">'+esc(r.arm)+'</span>'
          +'<span class="dot '+(v.case_pass?'ok':'no')+'"></span></div>'
          +'<div class="sub">'+esc(r.agent)+' · '+esc(res.config&&res.config.mode||'')+'</div>'
          +'<div class="foot"><span>'+esc(r.episode.terminal_reason)+' · '+r.episode.rounds+'轮</span>'
          +'<span class="q">q'+v3.q+' <span class="tierbadge '+tierClass(m6.tier)+'">'+esc(m6.tier||'-')+'</span></span></div>'
          +'</div>';
      });
    });
  } else {
    CASES.forEach(function(c,i){
      if(!matchFilter(c.caseId+' '+(c.title||'')+' '+(c.subtitle||'')+' '+(c.side||'')))return;
      var fav=(c.caseId==='R5C1'||c.caseId==='R5C7'||c.caseId==='R5C9');
      h+='<div class="item'+(i===state.qcase?' active':'')+(fav?' fav':'')+'" data-i="'+i+'">'
        +'<div class="top"><span class="cid">'+esc(c.caseId)+'</span>'
        +(c.side?'<span class="arm" style="background:var(--ink-3)">'+esc(c.side)+'</span>':'')+'</div>'
        +'<div class="ttl">'+esc(c.title||c.caseId)+'</div>'
        +'<div class="sub">'+esc(c.subtitle||'')+'</div>'
        +'</div>';
    });
  }
  var lst=document.getElementById('lst');
  lst.innerHTML=h||'<div class="empty">无匹配</div>';
  [].forEach.call(lst.querySelectorAll('.item'),function(el){
    el.onclick=function(){var i=+el.getAttribute('data-i');if(state.mode==='runs'){state.run=i;state.view='traj';}else{state.qcase=i;}render();document.getElementById('main').scrollTop=0;};
  });
}

/* ---------- header ---------- */
function renderHead(){
  if(state.mode==='queries'){
    var c=CASES[state.qcase]||{};
    var h='<div class="row1"><div><h2><span class="cid">'+esc(c.caseId)+'</span>'+esc(c.title||c.caseId)+'</h2>'
      +'<div class="chips">'
      +(c.side?'<span class="chip">side <b>'+esc(c.side)+'</b></span>':'')
      +(c.tier_axis?'<span class="chip">tier_axis <b>'+esc(c.tier_axis)+'</b></span>':'')
      +'<span class="chip">source <b>'+esc(c.source||'')+'</b></span>'
      +'</div></div></div>'
      +'<div class="note">题面视图 · <b>只看 query（agent 拿到的 input v0）</b>，不含轨迹与评分。</div>'
      +'<div class="viewtabs"><div class="vtab active">题面 · Raw Query</div></div>';
    document.getElementById('mhead').innerHTML=h;
    return;
  }
  var r=RUNS[state.run]; var res=r.result; var v=res.verdict||{}; var m6=(res.metrics||{}).M6||{};
  var c=CASE_BY_ID[r.caseId]||{}; var v3=computeV3(res);
  var h='<div class="row1"><div><h2><span class="cid">'+esc(r.caseId)+'</span>'+esc(c.title||r.caseId)+'</h2>'
    +'<div class="chips">'
    +'<span class="chip"><b>'+esc(r.arm)+'</b> arm</span>'
    +'<span class="chip">run <b>'+esc(r.run)+'</b></span>'
    +'<span class="chip">agent <b>'+esc(r.agent)+'</b></span>'
    +'<span class="chip">mode <b>'+esc(r.mode)+'</b></span>'
    +(c.subtitle?'<span class="chip">'+esc(c.subtitle)+'</span>':'')
    +'</div></div>'
    +'<div class="verdict-strip">'
    +'<span class="vpill '+(v3.gates?'pass':'fail')+'"><span class="vl">gates</span>'+(v3.gates?'PASS':'FAIL')+'</span>'
    +'<span class="vpill '+((res.metrics.M5||{}).pass?'pass':'fail')+'"><span class="vl">M5</span>'+((res.metrics.M5||{}).pass?'成交':'未过')+'</span>'
    +'<span class="vpill"><span class="vl">M6</span><span class="tierbadge '+tierClass(m6.tier)+'">'+esc(m6.tier||'-')+' · '+(m6.value!=null?m6.value:'-')+'</span></span>'
    +'<span class="vpill '+(v3.q>0?'pass':'fail')+'"><span class="vl">quality·V3</span>'+v3.q+'</span>'
    +'</div></div>';
  if(r.note) h+='<div class="note">'+esc(r.note)+'</div>';
  h+='<div class="viewtabs">'
    +'<div class="vtab'+(state.view==='traj'?' active':'')+'" data-v="traj">轨迹 · Full Trajectory</div>'
    +'<div class="vtab'+(state.view==='raw'?' active':'')+'" data-v="raw">原始 · Raw Records</div>'
    +'</div>';
  document.getElementById('mhead').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.vtab[data-v]'),function(el){el.onclick=function(){state.view=el.getAttribute('data-v');render();};});
}

/* ---------- trajectory ---------- */
function offerNonTrivial(o){return o && (o.price&&o.price.cash&&o.price.cash.amount!=null || (o.price&&o.price.in_kind&&o.price.in_kind.length) || (o.obligations&&o.obligations.length));}
function renderOffer(o,labels){
  if(!offerNonTrivial(o))return '';
  var h='<div class="offer"><div class="oh"><span>抽取报价 · extracted Deal</span><span class="st">status: '+esc(o.status)+'</span></div>';
  h+='<div class="orow"><span class="ol">cash</span><span class="ov">'+fmtCash(o.price&&o.price.cash)+'</span></div>';
  if(o.price&&o.price.in_kind&&o.price.in_kind.length){
    var iks=o.price.in_kind.map(function(k){var lab=labels&&labels[k.resource]?labels[k.resource]:'';return '<span class="ik"><span class="rid">'+esc(k.resource)+'</span> '+esc(k.description||lab)+'</span>';}).join('');
    h+='<div class="orow"><span class="ol">in_kind</span><span class="ov">'+iks+'</span></div>';
  }
  if(o.terms&&o.terms.format) h+='<div class="orow"><span class="ol">format</span><span class="ov">'+esc(o.terms.format)+'</span></div>';
  if(o.obligations&&o.obligations.length){
    var obs=o.obligations.map(function(b){return '<div class="obl">'+esc(b.text)+(b.maps_to_resource?' <span class="rt">→'+esc(b.maps_to_resource)+'</span>':'')+'</div>';}).join('');
    h+='<div class="orow"><span class="ol">义务</span><span class="ov">'+obs+'</span></div>';
  }
  return h+'</div>';
}
function renderTraj(){
  var r=RUNS[state.run]; var ep=r.episode; var res=r.result;
  var c=CASE_BY_ID[r.caseId]||{}; var labels=c.resourceLabels||{};
  var proc=ep.process||{}; var m=res.metrics||{};
  var h='<div class="mpanel"><div class="ph">评分 · metrics &amp; verdict</div><div class="mgrid">';
  function cell(id,label,val,cls,extra){return '<div class="mcell"><div class="mk"><b>'+id+'</b> '+label+'</div><div class="mv '+(cls||'')+'">'+val+(extra?' <small>'+extra+'</small>':'')+'</div></div>';}
  function pf(x){return x?'通过':'未过';}
  if(m.M1)h+=cell('M1','结构',pf(m.M1.pass),m.M1.pass?'ok':'no');
  if(m.M2)h+=cell('M2','忠实',pf(m.M2.pass),m.M2.pass?'ok':'no');
  if(m.M3)h+=cell('M3','不泄底',pf(m.M3.pass),m.M3.pass?'ok':'no');
  if(m.M4)h+=cell('M4','不越权',pf(m.M4.pass),m.M4.pass?'ok':'no');
  if(m.M5)h+=cell('M5','成交',pf(m.M5.pass),m.M5.pass?'ok':'no', m.M5.reason?esc(m.M5.reason):'');
  if(m.M6)h+=cell('M6','价值','<span class="tierbadge '+tierClass(m.M6.tier)+'">'+esc(m.M6.tier)+'</span>','','value '+m.M6.value);
  if(m.M8)h+=cell('M8','轮数',m.M8.value==null?'—':m.M8.value,'');
  if(m.M9)h+=cell('M9','让步',m.M9.value,'');
  if(m.M11)h+=cell('M11','诊断',esc(m.M11.verdict),m.M11.verdict==='full'?'ok':(m.M11.verdict==='fail'?'no':''));
  if(m.M12)h+=cell('M12','路径',esc(m.M12.verdict),m.M12.verdict==='full'?'ok':(m.M12.verdict==='fail'?'no':''));
  h+='</div>';
  var jn='';
  [['M2','忠实表达'],['M6','价值创造'],['M11','瓶颈诊断'],['M12','路径与应用']].forEach(function(p){
    var mm=m[p[0]]; if(mm&&mm.judge_notes){jn+='<div class="jnote"><div class="jh">'+p[0]+' · '+p[1]+' — judge note</div><div class="jt">'+esc(mm.judge_notes)+'</div></div>';}
  });
  if(jn)h+='<div class="jnotes">'+jn+'</div>';
  h+='</div>';
  h+='<div class="convmeta"><span>agent(A) = <b>'+esc(proc.agent_side||'A')+'</b></span>'
    +'<span>counterparty(B) = <b>'+esc(proc.sim_side||'B')+'</b></span>'
    +'<span>回合 <b>'+ep.rounds+'</b></span>';
  if(proc.skills_used&&proc.skills_used.length)h+='<span>skills: <b>'+proc.skills_used.map(esc).join(', ')+'</b></span>';
  if(proc.extract_fallbacks&&proc.extract_fallbacks.length)h+='<span class="warn">fallbacks: '+proc.extract_fallbacks.map(esc).join(', ')+'</span>';
  h+='</div>';
  var lastRound=0;
  ep.transcript.forEach(function(t){
    if(t.round!==lastRound){h+='<div class="rounddiv">第 '+t.round+' 轮 · round '+t.round+'</div>';lastRound=t.round;}
    var who=t.speaker==='A'?'<div class="who">A<small>agent</small></div>':'<div class="who">B<small>对手 sim</small></div>';
    h+='<div class="turn '+t.speaker+'">'+who+'<div class="bubble"><div class="msg">'+esc(t.message)+'</div>'+renderOffer(t.offer,labels)+'</div></div>';
  });
  var tr=ep.terminal_reason; var tcls=tr==='settled'?'settled':(tr==='walk_away'?'walk':'');
  h+='<div class="terminal"><span class="'+tcls+'">终局 · '+esc(tr)+(tr==='settled'?' ✓':'')+'</span></div>';
  h+='<div class="rounddiv">最终 deal · final_deal</div>';
  h+='<div class="turn A"><div class="who">FINAL<small>结算</small></div><div class="bubble">'+(renderOffer(ep.final_deal,labels)||'<span class="hint">（final_deal 为空）</span>')+'</div></div>';
  return h;
}

/* ---------- raw (per run) ---------- */
function highlight(obj){
  var s=JSON.stringify(obj,null,2);
  s=s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});
  s=s.replace(/("(\\.|[^"\\])*")(\s*:)?/g,function(m,str,_,colon){return colon?'<span class="k">'+str+'</span>'+colon:'<span class="s">'+str+'</span>';});
  s=s.replace(/\b(-?\d+\.?\d*)\b/g,'<span class="n">$1</span>');
  s=s.replace(/\b(true|false|null)\b/g,'<span class="b">$1</span>');
  return s;
}
function rawBlock(label,obj,copyKey){
  if(obj==null)return '<div class="rawwrap"><div class="rlabel">'+esc(label)+'</div><pre class="json">（该条目无此数据 / case 未解析）</pre></div>';
  return '<div class="rawwrap"><button class="copy" data-k="'+copyKey+'">复制 copy</button><div class="rlabel">'+esc(label)+'</div><pre class="json">'+highlight(obj)+'</pre></div>';
}
function renderRaw(){
  var r=RUNS[state.run]; var c=CASE_BY_ID[r.caseId]||{};
  var docs=[
    {k:'query',label:'查询 Query (input v0)'},
    {k:'episode',label:'轨迹 Episode (raw)'},
    {k:'result',label:'评分 Result (raw)'},
    {k:'fixture',label:'答案 Fixture'}
  ];
  var h='<div class="rawtabs">';
  docs.forEach(function(d){h+='<div class="rtab'+(state.raw===d.k?' active':'')+'" data-r="'+d.k+'">'+d.label+'</div>';});
  h+='</div>';
  if(state.raw==='query'){h+='<div class="hint">agent 看到的题面：initial_deal + 双方 profile/private。</div>'+renderQuery(c)+rawBlock('QUERY · input v0',c.input,'query');}
  else if(state.raw==='episode'){h+='<div class="hint">EpisodeOutput：final_deal + transcript + process。</div>'+rawBlock('EPISODE (raw)',r.episode,'episode');}
  else if(state.raw==='result'){h+='<div class="hint">EvaluationResult：metrics + verdict。</div>'+rawBlock('RESULT (raw)',r.result,'result');}
  else{h+='<div class="hint">打分器读的标准答案：ground_truth + tier_reference + answers。</div>'+rawBlock('FIXTURE (答案)',c.fixture,'fixture');}
  return h;
}

/* ---------- query render (shared by raw-tab + queries-mode) ---------- */
function renderQuery(c){
  var inp=c.input; if(!inp)return '<div class="empty">该 case 未解析出 input。</div>';
  var P=inp.parties||{};
  function party(key){
    var p=P[key]; if(!p)return '';
    var pp=p.public_profile||{}, pv=p.private||{}, cs=(pv.constraints||{}); var res=cs.reservation;
    var h='<div class="qcard"><div class="qh '+(key==='A'?'a':'b')+'"><span class="seat">'+key+'</span>'+esc(p.seat)+(key==='A'?' · 委托方(agent)':' · 对手(sim)')+'</div><div class="qb">';
    if(pp.current_focus||(pp.career&&pp.career.length))h+='<div class="qfield"><div class="fl">public profile</div><div class="fv">'+(pp.current_focus?esc(pp.current_focus):'')+(pp.career&&pp.career.length?' <span class="muted">· '+pp.career.map(esc).join(' / ')+'</span>':'')+(pp.location?' <span class="muted">· '+esc(pp.location)+'</span>':'')+'</div></div>';
    if(pv.intent)h+='<div class="qfield"><div class="fl">intent (表面诉求)</div><div class="fv">'+esc(pv.intent)+'</div></div>';
    if(pv.interests&&pv.interests.length)h+='<div class="qfield"><div class="fl">interests (真实利益 · 可能藏)</div><div class="fv">'+pv.interests.map(function(x){return '<span class="qtag">'+esc(x)+'</span>';}).join('')+'</div></div>';
    if(pv.value_perception)h+='<div class="qfield"><div class="fl">value perception</div><div class="fv">'+esc(pv.value_perception)+'</div></div>';
    if(res)h+='<div class="qfield"><div class="fl">reservation (底线)</div><div class="fv"><span class="qtag danger">'+esc(res.type)+' '+(res.amount!=null?'¥'+Number(res.amount).toLocaleString():'—')+'</span> <span class="muted">'+esc(res.note||'')+'</span></div></div>';
    if(cs.deal_breakers&&cs.deal_breakers.length)h+='<div class="qfield"><div class="fl">deal breakers (雷区)</div><div class="fv">'+cs.deal_breakers.map(function(x){return '<span class="qtag danger">'+esc(x)+'</span>';}).join('')+'</div></div>';
    if(cs.must_haves&&cs.must_haves.length)h+='<div class="qfield"><div class="fl">must haves</div><div class="fv">'+cs.must_haves.map(function(x){return '<span class="qtag">'+esc(x)+'</span>';}).join('')+'</div></div>';
    return h+'</div></div>';
  }
  var id=inp.initial_deal||{}; var cfg=inp.config||{};
  var h='<div class="qtop"><div class="qh">initial_deal · v0 标的</div>'
    +'<div class="qfield"><div class="fl">subject</div><div class="fv">'+esc(id.subject||'—')+'</div></div>'
    +'<div class="qfield"><div class="fl">price / terms</div><div class="fv">'+fmtCash(id.price&&id.price.cash)+(id.terms&&id.terms.format?' · '+esc(id.terms.format):' <span class="muted">· format 未定</span>')+'</div></div>'
    +'<div class="qfield"><div class="fl">config</div><div class="fv"><span class="qtag">agent_seat '+esc(cfg.agent_seat)+'</span><span class="qtag">round_cap '+esc(cfg.round_cap)+'</span></div></div>';
  if(c.difficultyNote)h+='<div class="qnote"><b>作者难度笔记(来自 fixture，非题面)：</b>'+esc(c.difficultyNote)+'</div>';
  h+='</div><div class="qgrid">'+party('A')+party('B')+'</div>';
  return h;
}
function renderQueryPage(){
  var c=CASES[state.qcase]; if(!c)return '<div class="empty">无</div>';
  return renderQuery(c)+'<div class="hint" style="margin-top:14px">↓ 原始 query JSON（input v0）</div>'+rawBlock('QUERY · input v0',c.input,'qinput');
}

function bindRaw(){
  [].forEach.call(document.querySelectorAll('.rtab'),function(el){el.onclick=function(){state.raw=el.getAttribute('data-r');render();};});
  [].forEach.call(document.querySelectorAll('.copy'),function(el){el.onclick=function(){
    var k=el.getAttribute('data-k'); var obj;
    if(state.mode==='queries'){obj=CASES[state.qcase].input;}
    else{var r=RUNS[state.run],c=CASE_BY_ID[r.caseId]||{};obj=k==='query'?c.input:k==='episode'?r.episode:k==='result'?r.result:c.fixture;}
    navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(obj,null,2));el.textContent='已复制 ✓';setTimeout(function(){el.textContent='复制 copy';},1200);
  };});
}

function render(){
  renderMode(); renderList(); renderHead();
  var body=document.getElementById('mbody');
  if(state.mode==='queries'){body.innerHTML=renderQueryPage();bindRaw();}
  else{body.innerHTML = state.view==='traj'?renderTraj():renderRaw(); if(state.view==='raw')bindRaw();}
}
document.getElementById('filter').addEventListener('input',function(e){state.filter=e.target.value;renderList();});
render();
</script>
</body>
