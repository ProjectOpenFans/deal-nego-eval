# nego-eval live-mode model wiring for OpenAI-compatible providers.
# Copy to eval.config.yaml and pick providers. Keys come from nego-eval/.env or the
# environment (STEP_API_KEY / QWEN_API_KEY / ZHIPU_API_KEY / DEEPSEEK_API_KEY),
# NOT from this file.
#
# Providers (presets in negoeval/llm/liveconfig.py):
#   stepfun -> https://api.stepfun.com/step_plan/v1   model step-3.7-flash   (reasoning_effort: low)
#   qwen    -> https://dashscope.aliyuncs.com/compatible-mode/v1  model qwen3.7-max
#   glm     -> https://open.bigmodel.cn/api/paas/v4   model glm-5.1          (thinking: enabled)
#   deepseek       -> https://api.deepseek.com   model deepseek-v4-flash    (cheaper default)
#   deepseek_flash -> https://api.deepseek.com   model deepseek-v4-flash    (thinking: enabled)
#   deepseek_pro   -> https://api.deepseek.com   model deepseek-v4-pro      (higher-cost Pro)

# Agent-under-test: the model you're benchmarking. Swap this, keep `aux` fixed, to compare.
agent:
  provider: stepfun
  # model: step-3.7-flash      # optional override
  # temperature: 0.3
  # thinking: true             # glm / deepseek
  # reasoning_effort: low      # stepfun; deepseek supports high / max

# Fixed neutral model for sim + M2/M6 judges + offer-extractor.
aux:
  provider: glm
